services:
  # PostgreSQL база данных
  db:
    image: postgres:16-alpine
    container_name: english-cards-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: english_cards
      POSTGRES_USER: ${POSTGRES_USER:-english_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-english_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - english-cards-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-english_user} -d english_cards"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend + Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-cards-web
    restart: unless-stopped
    environment:
      FLASK_APP: wsgi.py
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-this-to-random-secret-key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-english_user}:${POSTGRES_PASSWORD:-english_password}@db:5432/english_cards
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - english-cards-network
    command: >
      sh -c "
        flask db upgrade &&
        gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 wsgi:app
      "

  # PgAdmin для управления базой (опционально)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: english-cards-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - english-cards-network
    profiles:
      - tools

volumes:
  postgres_data:
  pgadmin_data:

networks:
  english-cards-network:
    driver: bridge
